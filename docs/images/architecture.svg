<svg xmlns="http://www.w3.org/2000/svg" width="960" height="912" viewBox="0 0 960 912" role="img" aria-labelledby="t d">
<title id="t">ReviewProof architecture</title>
<desc id="d">Your application submits an agent&#x27;s proposal. ReviewProof&#x27;s gate may add a planted error and returns one or two tickets for your review screen. The recorder logs each showing and one decision. The guard calls your writer function only if every check passes. Reviewers have no access to either file: planted.db is the restricted one and oversight.db holds the hash-chained log. rp craft and rp plant prepare planted errors; verified evidence feeds reports and alerts.</desc>
