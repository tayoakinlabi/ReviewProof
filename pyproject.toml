[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reviewproof"
dynamic = ["version"]
description = "Rubber-stamp detector for AI oversight: proves whether human reviewers of AI output catch errors."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "The ReviewProof Authors" }]
keywords = ["human-in-the-loop", "ai-oversight", "gxp", "automation-bias"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
langgraph = ["langgraph>=1.2.24"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "jsonschema>=4.21", "hypothesis>=6.100"]

[project.urls]
Repository = "https://github.com/tayoakinlabi/ReviewProof"
Issues = "https://github.com/tayoakinlabi/ReviewProof/issues"
Changelog = "https://github.com/tayoakinlabi/ReviewProof/blob/main/CHANGELOG.md"

[project.scripts]
rp = "reviewproof.cli.main:main"

[tool.hatch.version]
path = "src/reviewproof/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/reviewproof"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "docs", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --cov=reviewproof --cov-report=term-missing"
markers = ["req(id): requirement ID that the test verifies"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
