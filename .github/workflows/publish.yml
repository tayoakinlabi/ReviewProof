name: Publish to PyPI

# Started by hand only. PyPI accepts the upload through Trusted Publishing,
# so no password or API token is stored anywhere.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      # PyPI never accepts a filename twice, so stop early with a clear message.
      - name: Check that this version is not already on PyPI
        run: |
          version=$(grep '^__version__ = ' src/reviewproof/__init__.py | cut -d '"' -f 2 || true)
          if [ -z "$version" ]; then
            echo "::error::cannot read __version__ from src/reviewproof/__init__.py"
            exit 1
          fi
          url="https://pypi.org/pypi/reviewproof/$version/json"
          status=$(curl -s -o /dev/null -w '%{http_code}' --retry 3 --max-time 30 "$url" || true)
          case "$status" in
            404) echo "Version $version is not on PyPI yet." ;;
            200)
              echo "::error::reviewproof $version is already on PyPI. Raise __version__ in src/reviewproof/__init__.py before publishing."
              exit 1 ;;
            *)
              echo "::error::could not check PyPI for version $version (HTTP $status)."
              exit 1 ;;
          esac
      # PyPI shows the README as it is at release time: relative links would break there, and
      # links to a branch would drift. Point them at this version's tag.
      - name: Check that README links point at this version
        run: |
          version=$(grep '^__version__ = ' src/reviewproof/__init__.py | cut -d '"' -f 2)
          links=$(grep -oE '\]\([^)]+\)' README.md | sed -E 's/^\]\((.*)\)$/\1/' || true)
          bad=0
          for link in $links; do
            case "$link" in
              https://github.com/tayoakinlabi/ReviewProof/*/v$version/*) ;;
              https://github.com/tayoakinlabi/ReviewProof/*)
                echo "::error::README link is not pinned to v$version: $link"; bad=1 ;;
              https://*) ;;
              *) echo "::error::README link is relative, so it breaks on PyPI: $link"; bad=1 ;;
            esac
          done
          exit $bad
      - run: python -m pip install -e ".[dev]" build twine
      - run: ruff check .
      - run: pytest
      - run: python -m build
      - run: twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/reviewproof/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
