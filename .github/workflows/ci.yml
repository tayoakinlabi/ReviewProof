name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
      - name: At least 90% coverage of each safety-critical file
        shell: bash
        run: |
          for file in guard gate planted store/eventlog store/registry keyed adapters/tool; do
            echo "== $file"
            coverage report --fail-under=90 "src/reviewproof/$file.py"
          done

  adapters:
    # Each agent-library adapter, against the oldest supported release and the newest (ADR-005).
    strategy:
      fail-fast: false
      matrix:
        python: [lowest, "3.14"]  # each adapter says which version is its lowest
        release: [oldest, newest]
        adapter:
          - {extra: langgraph, package: langgraph, oldest: "1.2.24", module: langgraph,
             import: langgraph.types, lowest: "3.10"}
          - {extra: openai-agents, package: openai-agents, oldest: "0.26.0",
             module: openai_agents, import: agents, lowest: "3.10"}
          - {extra: pydantic-ai, package: pydantic-ai-slim, oldest: "2.76.0",
             module: pydantic_ai, import: pydantic_ai, lowest: "3.11"}
    name: adapters (${{ matrix.adapter.extra }}, ${{ matrix.release }}, ${{ matrix.python }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python == 'lowest' && matrix.adapter.lowest || matrix.python }}
      - run: python -m pip install -e ".[dev,${{ matrix.adapter.extra }}]"
      - name: Choose the library release
        shell: bash
        env:
          PACKAGE: ${{ matrix.adapter.package }}
          OLDEST: ${{ matrix.adapter.oldest }}
          RELEASE: ${{ matrix.release }}
        run: |
          if [ "$RELEASE" = newest ]; then
            python -m pip install --upgrade "$PACKAGE"
          else
            python -m pip install "$PACKAGE==$OLDEST"
          fi
          python -m pip show "$PACKAGE"
      # If the library could not be imported, its tests would be skipped without failing.
      - run: python -c "import ${{ matrix.adapter.import }}"
      - run: pytest tests/test_adapter_tool.py tests/test_adapter_${{ matrix.adapter.module }}.py
      - name: At least 90% coverage of the adapter files
        shell: bash
        env:
          MODULE: ${{ matrix.adapter.module }}
        run: |
          for file in tool "$MODULE"; do
            coverage report --fail-under=90 "src/reviewproof/adapters/$file.py"
          done

  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Every commit is signed off
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          failed=0
          for commit in $(git rev-list --no-merges "$BASE..$HEAD"); do
            if ! git log -1 --format=%B "$commit" | grep -q '^Signed-off-by: .\+ <.\+>'; then
              echo "Missing Signed-off-by: $commit"
              failed=1
            fi
          done
          exit $failed
